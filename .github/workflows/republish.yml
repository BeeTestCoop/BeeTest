{"name":"Republish release","on":{"workflow_dispatch":{"inputs":{"tag":{"required":true,"type":"string"},"latest":{"required":false,"type":"string","default":"false"}}}},"permissions":{"contents":"write"},"jobs":{"republish":{"runs-on":"ubuntu-latest","env":{"GH_TOKEN":"${{ github.token }}","GH_REPO":"${{ github.repository }}","TAG":"${{ inputs.tag }}"},"steps":[{"run":"set -e; mkdir assets; gh release download \"$TAG\" -D assets; gh release view \"$TAG\" --json name,body --jq .name > name.txt; gh release view \"$TAG\" --json body --jq .body > notes.md; gh release delete \"$TAG\" -y; gh release create \"$TAG\" assets/* --title \"$(cat name.txt)\" --notes-file notes.md --latest=${{ inputs.latest }}; gh release view \"$TAG\" --json author --jq .author.login"}]}}}
